name: Publish to MCP Registry

# A published release (release.sh --publish) lists its .mcpb in the MCP
# Registry. GitHub's OIDC token proves the io.github.oskar-szulc namespace,
# so no one has to log in by hand. Run it manually with dry_run to check the
# login and the entry without publishing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.1
        required: true
      dry_run:
        description: Log in and validate only
        type: boolean
        default: true

permissions:
  id-token: write # the OIDC token mcp-publisher logs in with
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Download the release's bundle
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.mcpb'
      - name: Write server.json
        run: |
          version=${TAG#v}
          sha=$(sha256sum "periscope-$version.mcpb" | cut -d' ' -f1)
          scripts/server-json.sh "$version" "$sha" > server.json
          cat server.json
      - name: Install mcp-publisher
        run: curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Validate
        run: ./mcp-publisher validate server.json
      - name: Publish
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        run: ./mcp-publisher publish server.json
